[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feax4d"
version = "0.1.0"
description = "4D-printing design toolkit: bilayer thermal shell topology optimisation + aligned-SH fibre-path generation, built on feax."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Naruki-Ichihara", email = "ichihara.naruki@nihon-u.ac.jp"},
]
keywords = ["JAX", "4D-printing", "topology-optimization", "fibre-path", "shell", "FEA"]
dependencies = [
    # feax is the FE backend dependency.  In this monorepo it is installed
    # (editable) alongside feax4d; pip resolves it from the already-installed
    # distribution rather than from an index.
    "feax",
    "nlopt",
    "numpy",
    "scikit-image",
    "meshio",
    "matplotlib",
    "shapely",        # polymer infill region/scanline generation (fibrifier)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["feax4d*"]
